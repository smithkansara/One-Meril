# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    container_name: LibreChat
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - mongodb
      - rag_api
      - redis  
    image: localhost/chatgpt.e-meril.in:v1
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - EMAIL_HOST=${EMAIL_HOST}
        #- REDIS_HOST=redis
        #- REDIS_PORT=6379
        #- REDIS_PASSWORD=testingpassword
        #- SESSION_STORE=redis
    command: npm run backend:dev    
          
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/api/logs
      - ./app/librechat.yaml:/app/librechat.yaml
        #- ./assets/ollama.png:/app/client/dist/assets/ollama.png
        #- ./assets/ollama.png:/app/client/public/assets/ollama.png
      - ./assets/logo.svg:/app/client/public/assets/logo.svg
      - ./assets/logo.svg:/app/client/dist/assets/logo.svg
      - ./assets/openai.svg:/app/client/public/assets/openai.svg
      - ./assets/openai.svg:/app/client/dist/assets/openai.svg
      - ./assets/favicon.ico:/app/client/dist/assets/favicon.ico
      - ./assets/favicon.ico:/app/client/public/assets/favicon.ico
      - ./assets/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png
      - ./assets/favicon-16x16.png:/app/client/public/assets/favicon-16x16.png
      - ./assets/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png
      - ./assets/favicon-32x32.png:/app/client/public/assets/favicon-32x32.png
      - ./assets/icon-192x192.png:/app/client/public/assets/icon-192x192.png
      - ./assets/icon-192x192.png:/app/client/dist/assets/icon-192x192.png
      - ./assets/apple-touch-icon-180x180.png:/app/client/public/assets/apple-touch-icon-180x180.png
      - ./assets/apple-touch-icon-180x180.png:/app/client/dist/assets/apple-touch-icon-180x180.png
        #- ./custom/custom.css:/app/client/dist/assets/custom.css
      #- ./custom/index.html:/app/client/dist/index.html 
    

      # - ./Image/logo.svg:/app/client/public/assets/logo.svg
      # - ./image:/app/client/public/assets
        
  
        # redis:   
        #image: redis:7-alpine
        #container_name: chat-redis
        #command: >
        #sh -c "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
        #environment:
        #- REDIS_PASSWORD=RedisChangeMe
        #restart: always
        #volumes:
        #- redisdata:/data
  mongodb:
    container_name: chat-mongodb
    image: localhost/chatgpt.e-meril.in-mongodb:v1
    restart: always
   
    volumes:
      - meril_mongo:/data/db
    command: mongod --noauth
    networks:
      - librechat-net  
  meilisearch:
    container_name: chat-meilisearch
    image: localhost/chatgpt.e-meril.in-meilisearch:v1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./meili_data_v1.12:/meili_data
  vectordb:
    container_name: vectordb
    image: localhost/chatgpt.e-meril.in-vectordb:v1
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - meril_pgvector:/var/lib/postgresql/data
  rag_api:
    container_name: rag_api
    image: localhost/chatgpt.e-meril.in-rag_api:v1
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env
        #  ollama:
        #image: localhost/chatgpt.e-meril.in-ollama:v1
        #deploy:
        #resources:
        #reservations:
        # devices:
        #   - driver: nvidia
        #     capabilities: [compute, utility]
        # ports:
        # - "11434:11434"
        #volumes:
        # - ./ollama:/root/.ollama  
  mcp-office-docs:
    # image: localhost/custom-mcp:latest
    image: localhost/final-mcp-office:latest
    container_name: mcp-office-docs
    restart: always
    ports:
      - "8958:8958"
    # Load configuration from .env (copy .env.example to .env and edit)
    env_file:
      - ./mcp/mcp-ms-office-documents/.env
    volumes:
      # Local output directory (used by LOCAL strategy)
      - type: bind
        source: ./mcp/mcp-ms-office-documents/output
        target: /app/output
        read_only: false
      # Custom Office templates (optional): custom_pptx_template_4_3.pptx, custom_pptx_template_16_9.pptx, custom_docx_template.docx, custom_email_template.html
      - ./mcp/mcp-ms-office-documents/custom_templates:/app/custom_templates
      # Config directory containing:
      #   - email_templates.yaml (dynamic email tool definitions – Mustache templates)
      #   - credentials or other configuration files (e.g., GCS service account JSON)
      - ./mcp/mcp-ms-office-documents/config:/app/config
    # command: 
    #   [
    #     "chmod", "777", "/app/output"
    #   ]
    # Optional: healthcheck could be added later when MCP protocol ping endpoint is exposed
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8958/mcp"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
  webserver:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./mcp/mcp-ms-office-documents/output:/app/output
      - ./webserver.py:/app/webserver.py
    command: ["python", "webserver.py"]
    ports:
      - "8000:8000"          

volumes:
   meril_mongo:
     external: true
   meril_pgvector:
     external: true
  #pgdata2:
    #mongodata:
    #redisdata:  

networks:
  librechat-net:
    external: true       

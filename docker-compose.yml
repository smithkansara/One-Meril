# Do not edit this file directly. Use a ‘docker-compose.override.yaml’ file if you can.
# Refer to `docker-compose.override.yaml.example’ for some sample configurations.

services:
  api:
    container_name: LibreChat
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      mongodb:
        condition: service_started
      rag_api:
        condition: service_started
      mcp-analytics:
        condition: service_healthy
      # - redis
    image: registry-git.e-meril.in/nexgen-it/chatgpt.e-meril.in/librechat:v3
    # image: registry.librechat.ai/danny-avila/librechat-dev-api:latest
    restart: always
    user: "${UID}:${GID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - MEILI_HOST=http://meilisearch:7700
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
      - EMAIL_HOST=${EMAIL_HOST}
        #- REDIS_HOST=redis
        #- REDIS_PORT=6379
        #- REDIS_PASSWORD=testingpassword
        #- SESSION_STORE=redis
    # command: npm run backend:dev    

    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - type: bind
        source: ./.env
        target: /app/api/.env
      - type: bind
        source: ./custom/manifest.webmanifest
        target: /app/client/dist/manifest.webmanifest
        read_only: true
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads:U
      - ./logs:/app/api/logs:U
      - ./app/librechat.yaml:/app/librechat.yaml
        #- ./assets/ollama.png:/app/client/dist/assets/ollama.png
        #- ./assets/ollama.png:/app/client/public/assets/ollama.png
      - ./assets/logo.svg:/app/client/public/assets/logo.svg
      - ./assets/logo.svg:/app/client/dist/assets/logo.svg
      - ./assets/openai.svg:/app/client/public/assets/openai.svg
      - ./assets/openai.svg:/app/client/dist/assets/openai.svg
      - ./assets/favicon.ico:/app/client/dist/assets/favicon.ico
      - ./assets/favicon.ico:/app/client/public/assets/favicon.ico
      - ./assets/favicon-16x16.png:/app/client/dist/assets/favicon-16x16.png
      - ./assets/favicon-16x16.png:/app/client/public/assets/favicon-16x16.png
      - ./assets/favicon-32x32.png:/app/client/dist/assets/favicon-32x32.png
      - ./assets/favicon-32x32.png:/app/client/public/assets/favicon-32x32.png
      - ./assets/icon-192x192.png:/app/client/public/assets/icon-192x192.png
      - ./assets/icon-192x192.png:/app/client/dist/assets/icon-192x192.png
      - ./assets/apple-touch-icon-180x180.png:/app/client/public/assets/apple-touch-icon-180x180.png
      - ./assets/apple-touch-icon-180x180.png:/app/client/dist/assets/apple-touch-icon-180x180.png
        #- ./custom/custom.css:/app/client/dist/assets/custom.css
      - ./custom/index.html:/app/client/dist/index.html 
      - ./assets/custom.css:/app/client/dist/assets/custom.css  
      - ./assets/maskable-icon.png:/app/client/dist/assets/maskable-icon.png


      # - ./Image/logo.svg:/app/client/public/assets/logo.svg
      # - ./image:/app/client/public/assets
        
  
        # redis:   
        #image: redis:7-alpine
        #container_name: chat-redis
        #command: >
        #sh -c "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
        #environment:
        #- REDIS_PASSWORD=RedisChangeMe
        #restart: always
        #volumes:
        #- redisdata:/data
    networks:
      - librechat-net
  mongodb:
    container_name: chat-mongodb
    image: registry-git.e-meril.in/nexgen-it/chatgpt.e-meril.in/mongodb:v1
    restart: always
   
    volumes:
      - meril_mongo:/data/db
    command: mongod --noauth
    networks:
      - librechat-net  
  meilisearch:
    container_name: chat-meilisearch
    image: registry-git.e-meril.in/nexgen-it/chatgpt.e-meril.in/meilisearch:v1
    restart: always
    user: "${UID}:${GID}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      # `:U` lets rootless podman chown the data dir to the container user (UID/GID),
      # fixing "Permission denied (os error 13)" — matches the ./uploads and ./logs mounts.
      - ./meili_data_v1.12:/meili_data:U
    networks:
      - librechat-net
  vectordb:
    container_name: vectordb
    image: registry-git.e-meril.in/nexgen-it/chatgpt.e-meril.in/vectordb:v1
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    restart: always
    volumes:
      - meril_pgvector:/var/lib/postgresql/data
    networks:
      - librechat-net
  rag_api:
    container_name: rag_api
    image: registry-git.e-meril.in/nexgen-it/chatgpt.e-meril.in/rag_api:v1
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    restart: always
    depends_on:
      - vectordb
    env_file:
      - .env
    networks:
      - librechat-net
  mcp-office-docs:
    # Built locally from ./mcp/mcp-ms-office-documents so it includes the
    # combined-report builder + POST /build-report route. (Registry image
    # mcp-office:v2 lacks these.)
    image: localhost/mcp-office:latest
    build:
      context: ./mcp/mcp-ms-office-documents
    container_name: mcp-office-docs
    restart: always
    ports:
      - "8958:8958"
    # Load configuration from .env (copy .env.example to .env and edit)
    env_file:
      - ./mcp/mcp-ms-office-documents/.env
    volumes:
      # Local output directory (used by LOCAL strategy)
      - ./mcp/mcp-ms-office-documents/output:/app/output:U
      # Custom Office templates (optional): custom_pptx_template_4_3.pptx, custom_pptx_template_16_9.pptx, custom_docx_template.docx, custom_email_template.html
      - ./mcp/mcp-ms-office-documents/custom_templates:/app/custom_templates:U
      # Config directory containing:
      #   - email_templates.yaml (dynamic email tool definitions – Mustache templates)
      #   - credentials or other configuration files (e.g., GCS service account JSON)
      - ./mcp/mcp-ms-office-documents/config:/app/config:U

    # command: 
    #   [
    #     "chmod", "777", "/app/output"
    #   ]
    # Optional: healthcheck could be added later when MCP protocol ping endpoint is exposed
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8958/mcp"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    networks:
      - librechat-net
      #This is the server that will handle the analytics for the MCP tool. It will be used to generate charts and graphs for the analytics dashboard.
  ollama:
    image: docker.io/ollama/ollama:0.6.8
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    environment:
      # Keep the model resident on the GPU once loaded (no per-request reload).
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    # ---- NVIDIA RTX A4000 GPU passthrough (manual, no CDI) ----
    # Podman 4.9.3 can't parse the host's NVIDIA CDI spec (uses the CDI 0.6.0
    # `additionalGids` field, which this podman rejects), so `nvidia.com/gpu=all`
    # is unusable. Instead we bind the compute device nodes (world-rw) and the
    # driver user-space libraries directly.
    # All library mounts use version-INDEPENDENT sonames (…so.1 / …so.4), which
    # Podman resolves to the current driver at mount time — so this needs NO
    # maintenance across NVIDIA driver upgrades. (libnvidia-gpucomp was verified
    # unnecessary for inference and is intentionally omitted, since it is the only
    # driver lib without a version-independent soname symlink.)
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    volumes:
      - ollama_data:/root/.ollama
      - /usr/lib/x86_64-linux-gnu/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libcudadebugger.so.1:/usr/lib/x86_64-linux-gnu/libcudadebugger.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-nvvm.so.4:/usr/lib/x86_64-linux-gnu/libnvidia-nvvm.so.4:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-cfg.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-cfg.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-allocator.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-allocator.so.1:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - librechat-net

  ollama-init:
    image: docker.io/ollama/ollama:0.6.8
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "qwen3:8b-q4_k_m"]
    restart: "no"
    networks:
      - librechat-net

  mcp-analytics:
    container_name: mcp-analytics
    image: localhost/mcp-analytics:latest
    build:
      context: ./mcp-analytics-server
    restart: always
    stop_signal: SIGINT
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MERIL_ANALYTICS_WEBHOOK_URL=${MERIL_ANALYTICS_WEBHOOK_URL}
      - MCP_PORT=8959
      - WEBSERVER_BASE_URL=${WEBSERVER_BASE_URL:-http://10.10.30.160:7001}
      - CHART_DIR=/app/charts
      - OLLAMA_URL=http://ollama:11434
      - QWEN_MODEL=${QWEN_MODEL:-qwen3:8b-q4_k_m}
      # GPU (16 GB VRAM) comfortably fits a larger context than the old CPU limit.
      - NUM_CTX=${NUM_CTX:-16384}
      - MAX_DATA_CHARS=${MAX_DATA_CHARS:-48000}
      - MCP_OFFICE_URL=http://mcp-office-docs:8958
    volumes:
      - ./mcp-analytics-server/charts:/app/charts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8959), 2).close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - librechat-net

  webserver:
    image: registry-git.e-meril.in/nexgen-it/chatgpt.e-meril.in/python-webserver:v1
    working_dir: /app
    volumes:
      - ./mcp/mcp-ms-office-documents/output:/app/output
      - ./mcp-analytics-server/charts:/app/analytics-charts
      - ./webserver.py:/app/webserver.py
    command: ["python", "webserver.py"]
    ports:
      - "7001:7001"
    networks:
      - librechat-net

volumes:
   meril_mongo:
     external: true
   meril_pgvector:
     external: true
   ollama_data:
  #pgdata2:
    #mongodata:
    #redisdata:  

networks:
  librechat-net:
    external: true       

    <script>
    /* Chart iframe renderer — replaces ```html <iframe src=…> code blocks with live iframes */
    (function () {
      function processChartBlocks() {
        document.querySelectorAll('code[class*="language-html"]:not([data-chart-done])').forEach(function (el) {
          var text = el.textContent || '';
          var m = text.match(/<iframe[^>]+src=["']([^"']+)["']/);
          if (!m) return;
          el.setAttribute('data-chart-done', '1');
          var url = m[1];

          var iframe = document.createElement('iframe');
          iframe.src = url;
          iframe.setAttribute('style',
            'width:100%;height:400px;border:none;border-radius:0 0 8px 8px;display:block;background:#111;');
          iframe.loading = 'lazy';

          var target = (el.closest && el.closest('pre')) || el.parentElement;
          if (target && target.parentElement) {
            target.parentElement.replaceChild(iframe, target);
          }
        });
      }

      var debounce;
      new MutationObserver(function () {
        clearTimeout(debounce);
        debounce = setTimeout(processChartBlocks, 200);
      }).observe(document.documentElement, { childList: true, subtree: true });

      if (document.readyState !== 'loading') {
        processChartBlocks();
      } else {
        document.addEventListener('DOMContentLoaded', processChartBlocks);
      }
    })();
    </script>
